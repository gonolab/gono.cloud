[package]
name = "gono-connect"
description = "Remote connectivity for Gono products: the one iroh endpoint configuration, device registration and the control channel of Gono Cloud."
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = []
# UPnP / NAT-PMP / PCP port mapping (plan D3). Off by default, and keep it off in products for
# now: NAT-PMP and PCP talk to the default gateway only, but UPnP follows the LOCATION of
# whichever device answers its SSDP search first, so any device on the LAN can make the endpoint
# send HTTP and SOAP requests to an address it names (Input Show's V4 test). Neither igd-next nor
# the portmapper crate checks that host against the default gateway, and iroh 1.4.1's
# PortmapperConfig cannot turn UPnP off alone. Turn it on only once upstream can, and run V4
# again then.
portmapper = ["iroh/portmapper"]

[dependencies]
base64.workspace = true
futures-util = { workspace = true, features = ["sink", "std"] }
gono-protocol.workspace = true
# The `Date` header of the registration answer: the flow's expiry by the server's clock.
httpdate.workspace = true
# Pinned exactly, like iroh-relay: the configuration of plan 3.5 is checked against this
# version. Only `tls-ring`: no metrics, no portmapper unless asked for, no Apple datapath.
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring"] }
n0-error = "1.0.3"
n0-future = "0.3.2"
rand.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio-tungstenite.workspace = true
tracing.workspace = true
url.workspace = true
webpki-roots = "1.0.12"

[dev-dependencies]
# Canned HTTP answers for the body limit.
http.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time", "test-util"] }

[lints]
workspace = true
