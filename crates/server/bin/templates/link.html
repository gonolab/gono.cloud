{%- extends "card.html" -%}
{%- block title %}{{ title }}{% endblock -%}
{%- block card %}
<h1>{{ title }}</h1>
<p class="muted mt-6">{{ chrome.t.link_lead }}</p>
<form method="post" action="/login/link" class="mt-20">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn primary block" type="submit" name="action" value="bind">{{ chrome.t.link_bind }}</button>
  <button class="btn block mt-6" type="submit" name="action" value="skip">{{ chrome.t.link_skip }}</button>
</form>
{%- endblock %}
