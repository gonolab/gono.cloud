{%- extends "card.html" -%}
{%- block title %}{{ chrome.t.forgot_title }}{% endblock -%}
{%- block card %}
<h1>{{ chrome.t.forgot_title }}</h1>
<p class="muted mt-6">{{ chrome.t.forgot_lead }}</p>
{%- if let Some(error) = error %}
<div class="flash bad" role="alert">{{ error }}</div>
{%- endif %}
<form method="post" action="/login/forgot">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label class="field" for="forgot-login"><span>{{ chrome.t.forgot_login }}</span>
    <input id="forgot-login" type="text" name="login" value="{{ login }}" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="254" required autofocus></label>
  <button class="btn primary block" type="submit">{{ chrome.t.forgot_send }}</button>
</form>
<p class="muted small mt-20"><a href="/login">{{ chrome.t.back_to_sign_in }}</a></p>
{%- endblock %}
