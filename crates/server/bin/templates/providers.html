{%- if !providers.is_empty() %}
<p class="muted small mt-20">{{ chrome.t.sign_in_other }}</p>
{%- for button in providers %}
{%- if button.link %}
<a class="btn block mt-6" href="{{ button.action }}">{{ button.label }}</a>
{%- else %}
<form method="post" action="{{ button.action }}" class="mt-6">
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <input type="hidden" name="purpose" value="sign_in">
  <input type="hidden" name="next" value="{{ next }}">
  <button class="btn block" type="submit">{{ button.label }}</button>
</form>
{%- endif %}
{%- endfor %}
{%- endif %}
