[package]
name = "gono-server-dav"
description = "WebDAV file system, metadata and locking for Gono Cloud, built on dav-server."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
dav-server.workspace = true
futures-util.workspace = true
gono-server-core.workspace = true
http.workspace = true
http-body.workspace = true
http-body-util.workspace = true
pin-project-lite.workspace = true
md-5.workspace = true
rand.workspace = true
sha1.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "rt", "sync"] }
tower-layer.workspace = true
tower-service.workspace = true
tracing.workspace = true
url.workspace = true
uuid.workspace = true
xml.workspace = true
xmltree.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix.workspace = true

[dev-dependencies]
# Test databases on SQLite or MySQL (`gono_server_core::db::testing`).
gono-server-core = { workspace = true, features = ["testing"] }
sqlx.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt", "rt-multi-thread", "sync"] }

[lints]
workspace = true
