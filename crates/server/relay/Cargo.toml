[package]
name = "gono-server-relay"
description = "The iroh relay through which devices reach each other across the internet."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
base64.workspace = true
bytes.workspace = true
futures-util = { workspace = true, features = ["sink"] }
gono-server-core.workspace = true
http.workspace = true
http-body-util.workspace = true
# The HTTP server and the WebSocket of the relay's listener (src/listener.rs), as iroh-relay's
# own server uses them: keep them at the versions iroh-relay brings.
hyper = { version = "1.12.0", features = ["http1", "server"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
iroh-base.workspace = true
iroh-relay.workspace = true
rustls.workspace = true
sha1.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-websockets = { version = "0.13.3", default-features = false, features = ["ring", "server"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
# Also used by examples/relay-probe.rs, the probe of the relay install test and the load numbers.
iroh-dns = "=1.4.1"
noq = { version = "=1.4.0", default-features = false, features = ["rustls-ring", "runtime-tokio"] }
rcgen = "0.14"
sha2.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "time"] }

[lints]
workspace = true
