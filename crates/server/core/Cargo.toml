[package]
name = "gono-server-core"
description = "Domain types, configuration, database access and errors for Gono Cloud."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
argon2.workspace = true
gono-protocol.workspace = true
ipnet.workspace = true
rand.workspace = true
ring.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
unicode-normalization.workspace = true
url.workspace = true
# The write gate of the database (db::begin_immediate).
tokio = { workspace = true, features = ["sync"] }

[features]
# `db::testing`: fresh test databases on SQLite, or on MySQL when `GONO_TEST_MYSQL_URL` is set.
# Enabled by the dev-dependencies of the crates whose tests need a database.
testing = []

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
# The crate itself with `testing`, for its integration tests.
gono-server-core = { path = ".", features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
