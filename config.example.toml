# Gono Cloud configuration.
#
# Copy this file to `config.toml` (or anywhere else) and point the server at it with
# `gono-cloud --config <path>` or the GONO_CLOUD_CONFIG environment variable. The default is
# `config.toml` in the current directory.
#
# - Unknown keys are rejected, so a typo fails loudly instead of being ignored.
# - Relative paths are resolved against the directory that contains this file.
# - Run `gono-cloud config check` to validate the file and print the effective settings.

[server]
# Address and port of the plain-HTTP listener. Gono Cloud does not terminate TLS: put a reverse
# proxy (nginx, Caddy, ...) in front of it. Only loopback addresses are accepted unless
# `allow_non_loopback_bind` is true. Default: "127.0.0.1:16102".
bind = "127.0.0.1:16102"

# Allow `bind` to use a non-loopback address, for example when the server runs in a container
# and the proxy reaches it over a container network. Make sure nothing but the proxy can connect.
# Default: false.
allow_non_loopback_bind = false

# Public origin of the server as clients see it: scheme, host and optional port, without a path.
# Used to build absolute URLs (Login Flow v2, capabilities, the notify_push WebSocket) and to
# check the origin of browser forms. It is never guessed from request headers, so it must match
# the address users open. See docs/reverse-proxy.md. Required.
base_url = "https://cloud.example.com"

# Reverse proxies allowed to set the client address through forwarding headers
# (X-Forwarded-For, Forwarded). IP addresses or CIDR blocks. Requests from any other peer keep
# their peer address and their forwarding headers are ignored. Default: [] (trust nobody).
trusted_proxies = ["127.0.0.1", "::1"]

[storage]
# Directory holding user files. It belongs to the server: change files only through WebDAV. If
# you change them directly (SSH, Samba, rsync, ...), run `gono-cloud rescan` afterwards.
# Created by `gono-cloud init` with this layout, which must sit on a single file system:
#   files/<user id>/    each user's files
#   uploads/<user id>/  chunked uploads in progress
#   tmp/                partial uploads, emptied at startup
#   deleted/            files of deleted users
# File names are stored in Unicode NFC; names in other forms are hidden until `rescan`.
# Required.
data_dir = "data"

[db]
# SQLite database with accounts and file metadata. Created by `gono-cloud init`. Required.
path = "gono-cloud.db"

# Maximum number of pooled connections, 1 to 64. Default: 8.
max_connections = 8

# Seconds a connection waits for a writer of another process (the CLI) before failing.
# Writers of the server queue in the server itself and do not count. Default: 5.
busy_timeout_secs = 5

[webdav]
# Longest lifetime of a WebDAV lock, in seconds, 1 to 604800. Clients refresh locks they still
# need; longer requests, including "Timeout: Infinite", are clamped to this value so that locks
# of crashed clients expire. Default: 3600.
max_lock_timeout_secs = 3600

[logging]
# Minimum level of Gono Cloud's own log events: "error", "warn", "info", "debug" or "trace".
# Dependencies only log warnings and errors. The GONO_CLOUD_LOG environment variable overrides
# this with a full tracing filter, for example GONO_CLOUD_LOG="info,sqlx=debug".
# Default: "info".
level = "info"

# File to append log lines to. When unset, `serve` logs to stdout, which suits systemd and
# containers. Other commands log only warnings and errors, to stderr. Passwords and tokens are
# never logged.
# file = "logs/gono-cloud.log"

[notify_push]
# Real-time change notifications for Nextcloud clients over WebSocket (`/push/ws`, advertised in
# the capabilities). The reverse proxy must pass WebSocket upgrades through; see
# docs/reverse-proxy.md. All values below must be at least 1. Default: true.
enabled = true

# Seconds between pings. A connection that has not answered by the next ping is closed, and
# each ping re-checks that the connection's app password is still valid. Default: 30.
ping_interval_secs = 30

# Seconds a new connection has to authenticate before it is closed. Default: 15.
auth_timeout_secs = 15

# Lifetime of a pre-auth token, in seconds. Default: 15.
pre_auth_ttl_secs = 15

# Debounce interval in seconds: notifications to one connection are at least this far apart,
# changes in between are merged into one, and no change waits longer than this. Default: 5.
debounce_secs = 5

# Maximum concurrent connections per user. Default: 64.
max_connections_per_user = 64

[admin]
# Serve the web admin UI: an overview of this server, user accounts and app passwords. Only
# accounts with the admin flag can sign in, with their web login password; app passwords cannot
# access it. Default: true.
enabled = true

# URL path of the admin UI. Letters, digits, "-", ".", "_" and "~" only, without a trailing
# slash; paths the server uses itself (/remote.php, /ocs, /index.php, /push, /apps, ...) are
# refused, apart from the default. Default: "/apps/manage".
path = "/apps/manage"

[files_ui]
# Serve the web file UI at /apps/files/ (browse, search, preview, upload, download, organize
# and favorites), with the sign-in page /login and the account page /apps/account/, where users
# change their web login password and manage their own app passwords. Users sign in with their
# web login password; app passwords cannot access it. "/" leads here. Default: true.
enabled = true

[relay]
# The relay through which devices (Input Show, and later other Gono products) reach each other
# across the internet when they cannot connect directly. It forwards packets that are encrypted
# end to end between the devices and never sees their content. `serve` runs it when enabled,
# and with an https base_url also serves remote access under /gono/v1/: device registration and
# the control channel (docs/connect-protocol.md); `gono-cloud relay` runs it alone on a host of
# its own. The reverse proxy needs a server block
# for it (docs/reverse-proxy.md), and QUIC address discovery a copy of its certificate
# (docs/deployment.md). Default: false.
enabled = false

# Public URL of the relay as devices see it. The relay needs a host name of its own: it cannot
# run below a path, so it cannot share base_url. Required when enabled.
# public_url = "https://relay.example.com"

# Address and port of the relay's plain-HTTP listener. The reverse proxy terminates HTTPS for
# public_url and forwards everything to it. Only loopback addresses are accepted unless
# server.allow_non_loopback_bind is true. Default: "127.0.0.1:16103".
bind = "127.0.0.1:16103"

# QUIC address discovery (QAD): a public UDP socket through which devices learn the public
# address they appear at, which they need to connect directly through NAT. Open this UDP port in
# the firewall. QUIC brings its own TLS, so the relay needs the certificate of public_url's host
# name and its key, readable by the service: copy them here from the reverse proxy after every
# renewal (docs/deployment.md). Relative paths are resolved against this file's directory. The
# files are read again every tls_reload_interval_secs seconds (default 3600), so a renewal needs
# no restart. Off unless qad_bind is set.
# qad_bind = "[::]:7842"
# tls_cert = "relay-tls/fullchain.pem"
# tls_key = "relay-tls/privkey.pem"

# Devices that may use the relay besides those registered for remote access, by device id: the
# 64 hex digits that Input Show shows for a device. `serve` admits the registered devices of
# accounts with remote access ([connect]) on its own, when base_url is https; `gono-cloud relay`
# on a host of its own admits only this list. Every other device is refused, and the log names
# it. Default: [].
allowed_endpoints = []

# Most bytes per second the relay reads from one device connection, and the largest burst it
# reads at once. Unlimited unless set.
# max_client_bytes_per_sec = 2097152
# max_client_burst_bytes = 262144

[connect]
# Remote access of devices, served by `serve` while the relay is enabled (docs/deployment.md,
# "Remote access").

# Whether remote access needs two-step verification on the account: registering a device,
# finding and reaching the account's other devices, and using the relay. TEMPORARY: it defaults
# to false only while remote control is in development, so that test accounts need no
# authenticator; config check warns about it. The default becomes true before remote control is
# released. Two-step verification still works for accounts that turn it on. Default: false.
# require_two_factor = true

[s3]
# The S3-compatible API: S3 clients and applications upload files with an access key, and files
# can be published for anonymous download. A bucket is a folder of its owner's tree, so files
# uploaded through S3 also appear in WebDAV, the Nextcloud clients and the web file UI. Access
# keys are created with `gono-cloud s3 key create`, on the account page or in the admin UI; their
# secrets are encrypted with two_factor.key_file below. The reverse proxy needs a server block
# for it (docs/reverse-proxy.md). Default: false.
enabled = false

# Public URL of the S3 API, the endpoint clients are configured with. It needs a host name of its
# own, other than base_url's: buckets are addressed right below the root, and files published
# for anonymous download must never share the site's host. Required when enabled.
# public_url = "https://s3.example.com"

# Address and port of the S3 API's plain-HTTP listener. The reverse proxy terminates HTTPS for
# public_url and forwards everything to it, with the Host header unchanged (it is signed). Only
# loopback addresses are accepted unless server.allow_non_loopback_bind is true.
# Default: "127.0.0.1:16104".
bind = "127.0.0.1:16104"

# The region clients sign their requests for. Most clients default to us-east-1.
# Default: "us-east-1".
region = "us-east-1"

# The folder, in each user's tree, that holds the buckets created through the S3 API
# (CreateBucket). Existing folders can be bound as buckets from the account page or the CLI.
# Default: "Buckets".
bucket_folder = "Buckets"

# Whether bucket owners may allow anonymous downloads: of single objects uploaded with the
# public-read ACL, or of a whole bucket, and anonymous listings. While false, every bucket answers
# as private. Default: false.
allow_anonymous = false

# Multipart uploads that are neither completed nor aborted within this many seconds are removed.
# Default: 604800 (a week).
multipart_ttl_secs = 604800

# Virtual-hosted-style addressing: buckets are also reachable as <bucket>.<domain>, for example
# https://photos.s3.example.com/<key> for "s3.example.com". Needs a wildcard DNS record and a
# wildcard certificate for *.<domain> at the reverse proxy (docs/reverse-proxy.md). Usually the
# host of public_url. Path style keeps working either way. Default: unset (path style only).
# virtual_host_domain = "s3.example.com"
# The domain below which buckets with a website configuration (PutBucketWebsite) are served as
# static websites: https://photos.web.example.com/ for "web.example.com", with index and error
# documents, to anonymous GET and HEAD requests, as far as the bucket lets anonymous requests
# read. A domain of its own, not the virtual_host_domain; needs a wildcard DNS record and
# certificate for *.<domain> forwarded to `bind` like the S3 host. Default: unset (no websites).
# website_domain = "web.example.com"

[two_factor]
# The key the TOTP secrets of two-step verification are encrypted with: 32 random bytes (or 64
# hex digits), readable by the service. Keep it outside the data directory and back it up with
# this file, apart from the database: without it, accounts with two-step verification cannot
# sign in, and `serve` refuses to start while any account uses it. Relative paths are resolved
# against this file's directory. `init` and the install script create it. Default:
# "two-factor.key".
key_file = "two-factor.key"
