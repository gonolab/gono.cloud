[workspace]
members = ["crates/client/*", "crates/protocol", "crates/server/*"]
# What a plain `cargo build` / `cargo test` in the repository root builds. Client crates (and the
# desktop, Android and iOS apps) will be workspace members but stay out of this list, so default
# builds never pull in Tauri or mobile toolchains; build them with `-p` or `--workspace`.
# See docs/repository-layout.md.
default-members = [
  "crates/protocol",
  "crates/server/bin",
  "crates/server/connect",
  "crates/server/core",
  "crates/server/dav",
  "crates/server/nextcloud",
  "crates/server/relay",
  "crates/server/s3",
]
# The acceptance suite is a standalone crate with its own `[workspace]`.
exclude = ["acceptance"]
resolver = "3"

[workspace.package]
version = "1.2.0"
edition = "2024"
# The newest stable release when it was last raised (for S3 support; s3s 0.17 itself needs
# 1.96). CI builds with the latest stable release; there is no separate check of this version.
rust-version = "1.100"
license = "MIT OR Apache-2.0"
repository = "https://github.com/gonolab/gono.cloud"
publish = false

[workspace.dependencies]
# Internal crates.
gono-connect = { path = "crates/client/connect" }
gono-protocol = { path = "crates/protocol" }
gono-server-connect = { path = "crates/server/connect" }
gono-server-core = { path = "crates/server/core" }
gono-server-dav = { path = "crates/server/dav" }
gono-server-nextcloud = { path = "crates/server/nextcloud" }
gono-server-relay = { path = "crates/server/relay" }
gono-server-s3 = { path = "crates/server/s3" }

# Pinned exactly: the WebDAV layer is built against this version's trait surface
# (`GuardedFileSystem`, `DavMetaData`, `DavLockSystem`). Upgrade deliberately.
# `proppatch` (a default feature since 0.12.0) provides PROPPATCH and
# `GuardedFileSystem::patch_props`; without it PROPPATCH answers 501.
dav-server = { version = "=0.12.0", default-features = false, features = ["localfs", "proppatch"] }

# Pinned exactly: the S3 protocol (SigV4 in headers and presigned URLs, aws-chunked bodies, XML,
# errors) of the S3 API, the way dav-server provides WebDAV. 0.x releases break their API often;
# upgrade deliberately and run the acceptance suite. The default features add nothing we use.
s3s = { version = "=0.17.0", default-features = false }

# Pinned exactly: the relay that devices reach each other through. Upgrades are deliberate: read
# the iroh security advisories and noq's merges of quinn fixes first, and check again that
# devices configured as in plan/remote-connect-iroh.md contact no third party. `server` brings
# `tls-ring`, the same crypto provider as rustls below.
iroh-base = { version = "=1.4.1", default-features = false, features = ["key"] }
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }

anyhow = "1.0.100"
argon2 = "0.6.0"
async-trait = "0.1.92"
askama = { version = "0.16.1", default-features = false, features = ["config", "derive", "std"] }
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22.1"
bytes = "1.12.1"
clap = { version = "4.6.0", features = ["derive", "env", "wrap_help"] }
crc32fast = "1.5.0"
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
http = "1.5.0"
http-body = "1.1.0"
http-body-util = "0.1.5"
httpdate = "1.0.3"
ipnet = "2.12.0"
libc = "0.2.191"
# Content types guessed from file name extensions: the table dav-server uses for WebDAV, so S3
# reports the same types.
mime_guess = { version = "2.0.5", default-features = false }
# Global allocator of the musl builds only; see crates/server/bin/src/main.rs.
mimalloc = { version = "0.1.52", default-features = false }
pin-project-lite = "0.2.17"
# The QR code of two-step verification enrolment, rendered as SVG on the server.
qrcodegen = "1.8.0"
rand = "0.10.3"
# HMAC-SHA-1 of TOTP and the AEAD of stored TOTP secrets; the version rustls already uses.
ring = "0.17.14"
rpassword = "7.5.0"
rustix = { version = "1.1.6", default-features = false, features = ["fs", "process", "std"] }
secrecy = "0.10.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = [
  "runtime-tokio",
  "sqlite-bundled",
  "migrate",
  "macros",
] }
tempfile = "3.27.0"
thiserror = "2.0.17"
# Dates of the S3 API's conditional requests; the version s3s uses.
time = { version = "0.3.55", default-features = false }
tokio = "1.54.0"
tokio-tungstenite = "0.29.0"
tungstenite = { version = "0.29.0", default-features = false }
toml = "1.2.0"
tower-http = { version = "0.7.1", default-features = false, features = ["compression-gzip"] }
tower-layer = "0.3.3"
tower-service = "0.3.3"
unicode-normalization = "0.1.26"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = [
  "ansi",
  "env-filter",
  "fmt",
  "smallvec",
  "std",
] }
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.29.2", features = ["v4"] }
xml = "1.4.0"
xmltree = "0.12.0"

[workspace.lints.rust]
unsafe_code = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"
unused_lifetimes = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
mem_forget = "warn"
large_types_passed_by_value = "warn"
semicolon_if_nothing_returned = "warn"
