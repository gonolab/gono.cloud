name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: "-D warnings"

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --workspace --locked

  acceptance:
    name: Acceptance suite, litmus and nextcloudcmd (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install litmus and nextcloudcmd
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends litmus nextcloud-desktop-cmd
          nextcloudcmd --version

      - name: Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            acceptance -> target

      # Builds the server, starts it on a throwaway installation, runs the black-box suite
      # (failures must match acceptance/new-expected-failures.txt) and then litmus against
      # /remote.php/dav/files/<user>/. Both must pass.
      - name: Acceptance suite and litmus
        env:
          RUN_LITMUS: "1"
        run: acceptance/scripts/run-new.sh

      # Syncs two folders with the Nextcloud desktop client's command line tool: first sync,
      # upload, a deep change from the other device, renames (including case-only), deletes and
      # a chunked upload.
      - name: nextcloudcmd sync scenarios
        run: acceptance/scripts/nextcloudcmd-scenarios.sh

  # Real S3 clients against the S3 API: the AWS CLI (`s3` and `s3api`, preinstalled on the
  # runner), rclone and restic as Ubuntu ships them, and mc built from its last release tag
  # (MinIO no longer publishes mc binaries). Virtual-hosted style uses <bucket>.s3.localhost,
  # which systemd-resolved answers with the loopback addresses. See
  # acceptance/scripts/s3-clients.sh. Then the selection of Ceph's s3-tests, whose failures
  # must match acceptance/s3-tests/expected-failures.txt (acceptance/scripts/s3-tests.sh).
  s3-clients:
    name: S3 clients and s3-tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install rclone, restic and mc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends rclone restic
          GOBIN="${RUNNER_TEMP}/bin" go install github.com/minio/mc@RELEASE.2025-08-13T08-35-41Z
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          aws --version
          rclone version | head -n 1
          restic version
          "${RUNNER_TEMP}/bin/mc" --version | head -n 1

      - name: Cache
        uses: Swatinem/rust-cache@v2

      # systemd-resolved answers <bucket>.s3.localhost with the loopback addresses (checked on
      # Ubuntu 24.04); should a runner image not, /etc/hosts gets the names the scenarios use.
      - name: Resolve the virtual-hosted names
        run: |
          for host in $(acceptance/scripts/s3-clients.sh --hosts); do
            if ! getent ahostsv4 "${host}" | grep -q '^127\.0\.0\.1 '; then
              echo "127.0.0.1 ${host}" | sudo tee -a /etc/hosts
            fi
          done

      - name: S3 client scenarios
        run: acceptance/scripts/s3-clients.sh

      # The last commit of ceph/s3-tests before the tests moved into the ceph repository.
      - name: Check out s3-tests
        uses: actions/checkout@v6
        with:
          repository: ceph/s3-tests
          ref: 5b3987116eca0b4b8fa57d6b10f3db57bab196b6
          path: s3-tests
          persist-credentials: false

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the requirements of s3-tests
        run: |
          python -m venv s3-tests/.venv
          s3-tests/.venv/bin/pip install --quiet -r acceptance/s3-tests/requirements.txt

      - name: s3-tests (selection)
        env:
          S3_TESTS: ${{ github.workspace }}/s3-tests
        run: acceptance/scripts/s3-tests.sh

  # Packs a debug build the way the release workflow packs release builds (a static musl build
  # with cargo-zigbuild, as released) and runs the install script end to end on the runner:
  # refused installs, a fresh install as a systemd service, WebDAV through the service, the
  # CLI's root guard, a graceful stop, an upgrade, a refused upgrade from 1.x and the uninstall.
  # It also checks that the binary is static and runs without glibc. See
  # packaging/server/test-install.sh and test-static.sh.
  install:
    name: Install script (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$(uname -m)-unknown-linux-musl"

      - name: Install zig and cargo-zigbuild
        run: |
          python3 -m venv "${RUNNER_TEMP}/zigbuild"
          "${RUNNER_TEMP}/zigbuild/bin/pip" install --require-hashes --no-deps \
            -r packaging/server/zigbuild-requirements.txt
          echo "${RUNNER_TEMP}/zigbuild/bin" >> "${GITHUB_PATH}"

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Lint the scripts
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version | sed -n 2p
          shellcheck -s sh packaging/server/*.sh

      - name: Build
        run: |
          target="$(uname -m)-unknown-linux-musl"
          cargo zigbuild --locked -p gono-server --target "${target}"
          echo "TARGET=${target}" >> "${GITHUB_ENV}"
          echo "BINARY=target/${target}/debug/gono-cloud" >> "${GITHUB_ENV}"

      - name: Package
        run: packaging/server/package.sh "${TARGET}" "${BINARY}" dist

      - name: Static binary without glibc
        run: packaging/server/test-static.sh dist/*.tar.gz

      - name: Install, upgrade and uninstall
        run: packaging/server/test-install.sh packaging/server/cloud.server.sh dist/*.tar.gz

  # Installs a static build with --relay-host, so that the relay runs in the hardened systemd
  # unit, behind nginx configured with the relay's server blocks of docs/reverse-proxy.md, and
  # hands its certificate over with the certbot deploy hook of docs/deployment.md. Then checks the
  # relay's own probes as devices use them: /generate_204 over plain HTTP on port 80 (not
  # redirected), HTTPS and the relay WebSocket, and QUIC address discovery on UDP 7842 with the
  # copied certificate, also after a renewal, without a restart. See
  # packaging/server/test-relay.sh; packaging/server/test-in-container.sh runs it locally.
  relay:
    name: Relay behind nginx under systemd (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$(uname -m)-unknown-linux-musl"

      - name: Install zig and cargo-zigbuild
        run: |
          python3 -m venv "${RUNNER_TEMP}/zigbuild"
          "${RUNNER_TEMP}/zigbuild/bin/pip" install --require-hashes --no-deps \
            -r packaging/server/zigbuild-requirements.txt
          echo "${RUNNER_TEMP}/zigbuild/bin" >> "${GITHUB_PATH}"

      - name: Install nginx
        run: |
          command -v nginx >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends nginx
          }
          nginx -v

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: |
          target="$(uname -m)-unknown-linux-musl"
          cargo zigbuild --locked -p gono-server --target "${target}"
          cargo build --locked -p gono-server-relay --example relay-probe
          echo "TARGET=${target}" >> "${GITHUB_ENV}"

      - name: Package
        run: packaging/server/package.sh "${TARGET}" "target/${TARGET}/debug/gono-cloud" dist

      - name: Relay probes under systemd
        run: |
          packaging/server/test-relay.sh packaging/server/cloud.server.sh dist/*.tar.gz \
            target/debug/examples/relay-probe

  # gono-connect dials relay first, so that a direct path that works one way only (a host
  # firewall refusing outbound UDP, an asymmetric filter) does not stop the connection. Runs
  # dials in network namespaces under nftables filters on either side, with iroh's own dial
  # as the control that must be stuck in exactly the one-way cases, and checks that a direct
  # path follows the relay, that a relay outage falls back to direct addresses, and that a
  # direct path that goes silent hands the connection to the relay within seconds (iroh's own
  # path timers, the control, take 15 s). See crates/client/connect/scripts/test-udp-paths.sh.
  udp-paths:
    name: Paths under UDP filters (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install nftables
        run: |
          command -v nft >/dev/null || {
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends nftables
          }
          nft --version

      - name: Cache
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --locked -p gono-connect --example udp-paths

      - name: Dials under UDP filters
        run: sudo crates/client/connect/scripts/test-udp-paths.sh target/debug/examples/udp-paths
